server {
    listen 443 ssl; 
    server_name docs.ilyl.life;  
    ssl_certificate /usr/share/certs/docs.ilyl.life.crt;
    ssl_certificate_key /usr/share/certs/docs.ilyl.life.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # 静态资源以 .gz 预压缩存储：
    # gzip_static always —— 对所有客户端都返回压缩版（带 Content-Encoding: gzip），
    # gunzip on —— 为不支持 gzip 的老客户端自动解压，兼顾镜像体积与兼容性
    gzip_static always;
    gunzip on;

    location / {
       root /usr/share/nginx/html;
       index index.html;
    }
}

server {
  listen 80;
  location /  {
    return 301 https://ilyl.life;
  }
}