# ============================================================
# 通用静态站点配置（反向代理后端）
#
# 容器内只提供纯 HTTP：不绑定域名、不加载证书、不监听 443。
# 域名解析与 HTTPS 由外层反向代理负责（如群晖 DSM 反代 + Let's Encrypt），
# 反代只需把请求转发到本容器的 80 端口，任意 Host 头都能命中。
# ============================================================
server {
    listen 80 default_server;
    server_name _;

    # 反代场景下重定向用相对地址，避免把容器内的协议/端口写进 Location
    absolute_redirect off;

    # 静态资源在构建阶段已用 gzip -9 预压缩为 .gz（原文件已删除）：
    #   gzip_static always —— 对所有客户端直接返回 .gz，带 Content-Encoding: gzip
    #   gunzip on          —— 不支持 gzip 的老客户端由 nginx 自动解压，保证兼容
    # 注意：不能用 try_files 判断资源是否存在——原文件已删，会被误判为不存在而绕过 gzip_static
    gzip_static always;
    gunzip on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
