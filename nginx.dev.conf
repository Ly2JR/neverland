# 本地开发用的通用配置：与 nginx.conf 保持一致（纯 HTTP / 无域名 / 反代友好）
# 如需用本地配置覆盖镜像内的 default.conf，可在 docker-compose.yml 里挂载此文件。
server {
    listen 80 default_server;
    server_name _;

    absolute_redirect off;

    # 构建阶段已把 JS/CSS 等压成 .gz 并删除原文件，必须靠 gzip_static 返回
    gzip_static always;
    gunzip on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
